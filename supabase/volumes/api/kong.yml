_format_version: "1.1"

###############################################################################
# Supabase API Gateway — Kong declarative config
#
# Routes:
#   /rest/v1/  → PostgREST (data API)
#
# ANON_KEY and SERVICE_ROLE_KEY 透過 Kong 環境變數注入（Kong 2.8+ ${{ENV_VAR}} 語法）
###############################################################################

services:
  - name: postgrest
    url: http://rest:3000/
    routes:
      - name: postgrest-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - service_role

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${{SUPABASE_ANON_KEY}}
    acls:
      - group: anon

  - username: service_role
    keyauth_credentials:
      - key: ${{SUPABASE_SERVICE_KEY}}
    acls:
      - group: service_role
