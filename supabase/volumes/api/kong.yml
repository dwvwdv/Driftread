_format_version: "1.1"

###############################################################################
# Supabase API Gateway — Kong declarative config
#
# Routes:
#   /rest/v1/  → PostgREST (data API)
#   /auth/v1/  → GoTrue    (authentication)
#
# ANON_KEY and SERVICE_ROLE_KEY are injected via Kong environment variables
# using the ${{ENV_VAR}} syntax (Kong 2.8+).
###############################################################################

services:
  - name: postgrest
    url: http://rest:3000/
    routes:
      - name: postgrest-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - anon
            - service_role

  - name: gotrue
    url: http://auth:9999/
    routes:
      - name: gotrue-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${{SUPABASE_ANON_KEY}}
    acls:
      - group: anon

  - username: service_role
    keyauth_credentials:
      - key: ${{SUPABASE_SERVICE_KEY}}
    acls:
      - group: service_role
