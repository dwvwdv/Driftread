name: Docs

# 不設 paths 篩選：只改名或刪除被文件引用的程式檔、未動到任何 .md 的 PR，
# 同樣可能讓文件裡的連結或路徑失效。檢查只需幾秒，每次都跑。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: Consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements-docs.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-docs.txt

      - name: Check docs
        run: python3 scripts/check_docs.py --github
