name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.md'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.md'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  check:
    name: Consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check docs
        run: python3 scripts/check_docs.py --github
