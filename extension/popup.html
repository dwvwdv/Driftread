<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Add to Driftread</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 360px; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .feed { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
    .feed-title { font-weight: 600; font-size: 13px; }
    .feed-url { font-size: 11px; color: #666; word-break: break-all; }
    button { background: #1976d2; color: white; border: 0; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    button:disabled { background: #aaa; cursor: default; }
    button.secondary { background: #fff; color: #1976d2; border: 1px solid #1976d2; }
    .empty { color: #888; font-size: 12px; }
    .config-hint { font-size: 11px; color: #ed6c02; margin-top: 8px; }
    a { color: #1976d2; }
  </style>
</head>
<body>
  <h1>偵測到的 RSS</h1>
  <div id="list"></div>
  <div id="config-hint" class="config-hint" style="display:none;">
    請先在<a href="#" id="open-options">擴充選項</a>設定 Driftread API URL 與金鑰。
  </div>
  <script src="popup.js"></script>
</body>
</html>
