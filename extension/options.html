<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>Driftread 設定</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    label { display:block; margin-top:12px; font-weight:600; font-size:13px; }
    input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
    button { margin-top: 16px; background: #1976d2; color: white; border: 0; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .saved { color: #2e7d32; margin-top: 12px; font-size: 13px; }
    .hint { color: #666; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h2>Driftread 擴充設定</h2>
  <label>API URL
    <input id="apiUrl" placeholder="https://your-driftread-host.example.com/api" />
    <div class="hint">後端 API 路徑，包含 /api。</div>
  </label>
  <label>Admin API Key
    <input id="apiKey" type="password" placeholder="與後端的 ADMIN_API_KEY 一致" />
    <div class="hint">用於匯入 feed 到資料庫。</div>
  </label>
  <button id="save">儲存</button>
  <div id="saved" class="saved" style="display:none;">已儲存。</div>
  <script src="options.js"></script>
</body>
</html>
