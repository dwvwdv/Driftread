services:

  api:
    image: ghcr.io/dwvwdv/driftread-api:latest
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default

  frontend:
    image: ghcr.io/dwvwdv/driftread-frontend:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - web_network

networks:
  default:
  web_network:
    external: true
