<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>漂流閱讀 Driftread — RSS 推薦與閱讀平台</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="漂流閱讀 Driftread：以「猜你喜歡」為核心的 RSS 推薦平台，幫你挖掘還沒遇見的資訊源，並在站內直接讀完全文。"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#2e3440" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eceff4" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Runtime Supabase config, read by src/app/services/runtime-config.ts. A
      plain (non-module) script executes synchronously as the parser reaches
      it, before the deferred Angular bundle scripts the CLI injects at the
      end of <body> — so window.__env is already set by the time AuthService
      constructs. See public/env.js (local-dev default) and
      docker-entrypoint.d/15-render-driftread-env.sh (real deploys).
    -->
    <script src="env.js"></script>
    <!--
      Applies the saved theme before the first paint. Without it a light-mode user
      sees a dark flash on every load, because the stylesheet defaults to dark and
      ThemeService only runs once Angular has bootstrapped.

      Kept deliberately tiny and inline. Storage key and attribute name must stay
      in sync with src/app/services/theme.ts. Note this needs 'unsafe-inline' (or a
      hash) if a CSP is ever added in frontend/nginx.conf.
    -->
    <script>
      try {
        var t = localStorage.getItem('driftread_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
