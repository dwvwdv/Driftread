<div class="shell">
  <form class="panel" (ngSubmit)="submit()">
    <div class="head">
      <ob-icon name="lock" [size]="16" />
      <span class="ob-label">DRIFTREAD MANAGE</span>
    </div>
    <div class="body">
      <h1>後台管理</h1>
      @if (challenge()) {
        <p class="lede">請輸入 Telegram 收到的 6 位數驗證碼，5 分鐘內有效。</p>
        <label class="field">
          <span class="ob-label">Telegram 驗證碼</span>
          <input
            class="ob-input"
            type="text"
            name="code"
            autocomplete="one-time-code"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            [disabled]="busy()"
            [(ngModel)]="code"
          />
        </label>
        <button
          type="button"
          class="ob-btn ob-btn--ghost"
          [disabled]="busy() || cooldown() > 0"
          (click)="resend()"
        >
          {{ cooldown() > 0 ? cooldown() + ' 秒後可重送' : '重送驗證碼' }}
        </button>
        <button type="button" class="ob-btn ob-btn--ghost" [disabled]="busy()" (click)="restart()">
          重新登入
        </button>
      } @else {
        <p class="lede">請使用管理員帳號登入，接著完成 Telegram 兩步驟驗證。</p>
        <label class="field">
          <span class="ob-label">Email</span>
          <input
            class="ob-input"
            type="email"
            name="email"
            autocomplete="username"
            [disabled]="busy() || !auth.isConfigured()"
            [(ngModel)]="email"
          />
        </label>
        <label class="field">
          <span class="ob-label">密碼</span>
          <input
            class="ob-input"
            type="password"
            name="password"
            autocomplete="current-password"
            [disabled]="busy() || !auth.isConfigured()"
            [(ngModel)]="password"
          />
        </label>
      }
      @if (error()) {
        <p class="err" role="alert">{{ error() }}</p>
      }
      @if (!auth.isConfigured()) {
        <p class="err" role="alert">登入服務尚未設定，請聯絡管理員。</p>
      }
    </div>
    <div class="actions">
      <a class="ob-btn ob-btn--ghost" routerLink="/">回前台</a>
      <button
        type="submit"
        class="ob-btn ob-btn--primary"
        [disabled]="busy() || !auth.isConfigured()"
      >
        {{ busy() ? '處理中…' : challenge() ? '驗證並進入後台' : '登入並傳送驗證碼' }}
      </button>
    </div>
  </form>
</div>
