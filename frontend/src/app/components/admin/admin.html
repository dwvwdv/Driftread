<h1>後台管理</h1>

<mat-card class="section">
  <mat-card-header><mat-card-title>API 金鑰</mat-card-title></mat-card-header>
  <mat-card-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Admin API Key</mat-label>
      <input matInput type="password" [value]="apiKey()" (input)="apiKey.set($any($event.target).value)">
    </mat-form-field>
  </mat-card-content>
</mat-card>

<mat-card class="section">
  <mat-card-header><mat-card-title>匯入信息源（JSON）</mat-card-title></mat-card-header>
  <mat-card-content>
    <p class="hint">格式：<code>[&#123;"title":"...", "url":"...","category":"...","tags":["..."]&#125;]</code></p>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>JSON 內容</mat-label>
      <textarea matInput rows="10" [value]="importJson()" (input)="importJson.set($any($event.target).value)"></textarea>
    </mat-form-field>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button color="primary" (click)="importFeeds()" [disabled]="importing()">
      @if (importing()) { 匯入中... } @else { 匯入 }
    </button>
  </mat-card-actions>
</mat-card>

<mat-card class="section">
  <mat-card-header>
    <mat-card-title>封存信息源</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (loadingArchived()) {
      <mat-spinner diameter="32" />
    }
    <mat-list>
      @for (feed of archivedFeeds(); track feed.id) {
        <mat-list-item>
          <span matListItemTitle>{{ feed.title }}</span>
          <span matListItemLine>{{ feed.url }}</span>
          <div matListItemMeta>
            <button mat-stroked-button (click)="unarchive(feed)">恢復</button>
            <button mat-stroked-button color="primary" (click)="refresh(feed)">更新文章</button>
          </div>
        </mat-list-item>
        <mat-divider />
      } @empty {
        <p class="empty">無封存信息源。</p>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
