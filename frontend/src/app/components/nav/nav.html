<mat-toolbar color="primary">
  <a mat-button routerLink="/" class="brand">漂流閱讀 Driftread</a>
  <span class="spacer"></span>
  <a mat-button routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">信息源</a>
  <a mat-button routerLink="/discover" routerLinkActive="active">發現</a>
  <a mat-button routerLink="/recommendations" routerLinkActive="active">猜你喜歡</a>
  @if (auth.session()) {
    <a mat-button routerLink="/me/feeds" routerLinkActive="active">我的訂閱</a>
    <a mat-button routerLink="/me/bookmarks" routerLinkActive="active">收藏</a>
    <button mat-button (click)="signOut()">登出 ({{ auth.userEmail }})</button>
  } @else {
    <a mat-button routerLink="/login" routerLinkActive="active">登入</a>
  }
  <a mat-button routerLink="/admin" routerLinkActive="active">後台</a>
</mat-toolbar>
