<div class="wrap">
  <form class="panel" (ngSubmit)="submit()">
    <div class="head">
      <span class="ob-label">SIGN IN</span>
    </div>

    <div class="body">
      <h1>登入漂流閱讀</h1>

      @if (!auth.isConfigured()) {
        <ob-callout tone="warning" heading="這個部署沒有設定 Supabase">
          登入功能尚未設定，請聯絡管理員。瀏覽信息源與「猜你喜歡」仍可正常使用。
        </ob-callout>
      }

      <p class="lede">目前不開放註冊，請使用既有帳號登入。</p>

      <label class="field">
        <span class="ob-label">Email</span>
        <input
          class="ob-input"
          name="email"
          type="email"
          autocomplete="email"
          [disabled]="!auth.isConfigured()"
          [(ngModel)]="email"
        />
      </label>

      <label class="field">
        <span class="ob-label">密碼</span>
        <input
          class="ob-input"
          name="password"
          type="password"
          autocomplete="current-password"
          [disabled]="!auth.isConfigured()"
          [(ngModel)]="password"
        />
      </label>

      @if (error()) {
        <p class="err" role="alert">{{ error() }}</p>
      }
      @if (info()) {
        <p class="ok" role="status">{{ info() }}</p>
      }
    </div>

    <div class="actions">
      <button
        type="submit"
        class="ob-btn ob-btn--primary ob-btn--block"
        [disabled]="busy() || !auth.isConfigured()"
      >
        @if (busy()) {
          處理中…
        } @else {
          登入
        }
      </button>
    </div>
  </form>
</div>
