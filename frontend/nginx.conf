server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: the latter appends to
        # any X-Forwarded-For the caller already sent instead of replacing it,
        # so a client could set its own X-Forwarded-For and have nginx forward
        # a chain starting with that attacker-chosen value. The backend's
        # ProxyHeadersMiddleware (see backend/main.py) trusts this header
        # completely (trusted_hosts="*", since nginx is its only possible
        # peer) — it must never contain anything the client can control.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
