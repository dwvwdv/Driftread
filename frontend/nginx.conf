server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Keep OAuth request URLs out of referrers and prevent framed consent UI.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: the latter appends to
        # any X-Forwarded-For the caller already sent instead of replacing it,
        # so a client could set its own X-Forwarded-For and have nginx forward
        # a chain starting with that attacker-chosen value. The backend's
        # ProxyHeadersMiddleware (see backend/main.py) trusts this header
        # completely (trusted_hosts="*", since nginx is its only possible
        # peer) — it must never contain anything the client can control.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # OAuth discovery must reach the API rather than Angular's index.html.
    location ^~ /.well-known/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # PWA (issue #92). These must be revalidated on every request: the
    # service worker's update check reads ngsw.json, index.html/env.js are the
    # unhashed entry points (env.js is rendered at container start), and a
    # stale worker script would pin an old app version. Hashed bundles keep
    # nginx's default caching. A location-level add_header drops the
    # server-level ones, so the security headers are repeated here.
    location ~ ^/(index\.html|env\.js|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
